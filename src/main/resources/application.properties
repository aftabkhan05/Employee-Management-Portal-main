# Render injects PORT; falls back to 8080 locally
server.port=${PORT:8080}
spring.application.name=HR-Management-Portal

# Database config - override with environment variables in production (Render)
# Local defaults are unchanged from the original project.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hmp}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:239804}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep the pool small so it fits free/low-tier MySQL connection limits
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
